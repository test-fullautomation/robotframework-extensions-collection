#
# RobotframeworkExtensions - pyproject.toml
#
# --------------------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools==79.0.1", "wheel", "colorama==0.4.6", "pypandoc_binary==1.15", "PythonExtensionsCollection"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-extensions-collection"
version = "0.10.1"
description = "Additional Robot Framework keywords"
authors = [
   {name = "Holger Queckenstedt", email = "Holger.Queckenstedt@de.bosch.com"}
]
maintainers = [
   {name = "Holger Queckenstedt", email = "Holger.Queckenstedt@de.bosch.com"}
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
   "PythonExtensionsCollection",
   "robotframework"
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/robotframework-extensions-collection"

[tool.setuptools]
packages = ["RobotframeworkExtensions"]

[tool.setuptools.package-data]
RobotframeworkExtensions = ["*.pdf"]
